<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; margin: 6px 0; background: #f4f4f4; border-radius: 6px; }
        .done { text-decoration: line-through; color: #888; }
        .empty { color: #999; font-style: italic; }
        .status { color: #666; margin-left: 6px; }
    </style>
</head>
<body>
    <h1>Мой список задач</h1>

    {% if items %}
        <ul>
            {% for item in items %}
                <li class="{% if item.status == 'done' %}done{% endif %}">
                    <strong>#{{ item.id }}</strong>
                    {{ item.title }}
                    <em class="status">[{{ item.status }}]</em>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty">Список пуст. Добавь первую задачу!</p>
    {% endif %}
</body>
</html>
