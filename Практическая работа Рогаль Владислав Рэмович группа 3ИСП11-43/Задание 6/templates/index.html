<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
        input { padding: 9px; width: 70%; max-width: 460px; }
        button { padding: 10px 14px; cursor: pointer; }
        .error { color: #b00020; margin: 12px 0; }
        li { margin: 10px 0; }
        .status { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Список задач</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="text" name="title" placeholder="Название задачи">
        <button type="submit">Добавить</button>
    </form>

    <h2>Мои задачи</h2>
    {% if items %}
        <ul>
        {% for item in items %}
            <li>
                {{ item["title"] }}
                <span class="status">— {{ item["status"] }}</span>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Пока задач нет.</p>
    {% endif %}
</body>
</html>
